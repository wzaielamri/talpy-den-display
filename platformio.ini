; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:advance-hmi]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = ESP32-S3-WROOM-1-N16R8
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter, esp32_exception_decoder
board_build.arduino.partitions = partitions.csv
board_upload.partitions = partitions.csv
; DESK_DEBUG=1: the board also prints every message it gets and every backlight command (include/debug_log.h)
build_flags = 
	-D DESK_DEBUG=0
	-DCONFIG_SPIRAM_SPEED_120M=1
	-DLV_CONF_INCLUDE_SIMPLE
	-I include
lib_deps = 
	lvgl/lvgl@9.1.0
	lovyan03/LovyanGFX@1.2.26
	bblanchon/ArduinoJson@7.4.3